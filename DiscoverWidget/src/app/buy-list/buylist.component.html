
<div class="buylist-table">
  <div class="extstats-table-block">
    <es-table-controller [table]="buylistTable"></es-table-controller>
    <table es-table class="table extstats-table" [data]="rows" #buylistTable="esTable"
           [rowsOnPage]="30" [sortBy]="'name'" [sortOrder]="'asc'">
      <thead es-table-head [columns]="columns"></thead>
      <tbody es-table-body [columns]="columns"></tbody>
    </table>
  </div>
</div>

<ng-template #boardgame let-game>
  <boardgame [game]="game" [allTags]="tagService.allTags"></boardgame>
</ng-template>
