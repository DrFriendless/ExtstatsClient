<table class="table extstats-table yearly-best-days">
  <thead>
  <tr><th class="col-long-date">Date</th><th class="col-number">Score</th><th class="plays">Plays</th></tr>
  </thead>
  <tbody>
    @for (row of rows; track row) {
      <tr>
        <td class="col-long-date">{{row.ymd.toDateString()}}</td>
        <td class="col-number">{{row.score.toFixed(0)}}</td>
        <td class="plays">
          @for (desc of row.playDescs; track desc.bggid) {
            @if (!$first) {
              <span>, </span>
            }
            <span>
            {{desc.quantity}} plays of <a href="https://boardgamegeek.com/boardgame/{{desc.bggid}}">{{desc.game}}</a>
            </span>
          }
        </td>
      </tr>
    }
  </tbody>
</table>
