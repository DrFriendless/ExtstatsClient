<div class="rbyr-table">
  <table>
    @for (row of rows; track row) {
      <tr>
        <td style="border: none; font-size: 12px">{{row.title}}</td>
        @for (col of row.columns; track col) {
          <td [ngClass]="'rating'+col.rating" title="{{col.tooltip}}" height="12px">&nbsp;</td>
        }
      </tr>
    }
  </table>
</div>
